name: portfolio_workspace

repository: https://github.com/aaita/portfolio

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: false

scripts:
  analyze:
    run: melos exec -- dart analyze .

  run:portfolio:
    run: cd apps/portfolio && flutter run -d chrome --dart-define=USE_FIREBASE=false
    description: Run portfolio with local preview storage

  run:dashboard:
    run: cd apps/dashboard && flutter run -d chrome --dart-define=USE_FIREBASE=false
    description: Run dashboard with local preview storage

  build:portfolio:
    run: cd apps/portfolio && flutter build web --dart-define=USE_FIREBASE=true
    description: Build portfolio for Firebase after production preparation

  build:dashboard:
    run: cd apps/dashboard && flutter build web --dart-define=USE_FIREBASE=true
    description: Build authenticated dashboard after production preparation
