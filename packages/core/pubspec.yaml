name: core
description: "Shared models, services, and utilities for the portfolio workspace"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.0
  firebase_storage: ^13.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.0
  web: ^1.1.1

flutter:
  assets:
    - assets/content.json
    - assets/projects/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
