  firebase_storage: ^13.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  shared_preferences: ^2.5.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
